apiVersion: v1
kind: ConfigMap
metadata:
  name: truplane-control-plane-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: truplane
data:
  truplane-control-plane-dashboard.json: |
    {
      "editable": true,
      "title": "Truplane v3 Control Plane — Unified Reliability & FinOps",
      "uid": "truplane-control-plane-v3",
      "schemaVersion": 39,
      "tags": ["truplane", "finops", "focus-1.5", "k8s-safescale", "data-snap", "drift-gate"],
      "panels": [
        {"id": 1, "title": "Total FOCUS Effective Spend (USD)", "type": "stat", "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0}, "targets": [{"expr": "focus_ledger_total_effective_cost_usd", "refId": "A"}]},
        {"id": 2, "title": "K8s SafeScale Verified Monthly Savings (USD)", "type": "stat", "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0}, "targets": [{"expr": "sum(focus_ledger_rightsizing_savings_usd)", "refId": "A"}]},
        {"id": 3, "title": "Data Snap Cost of Quality Incidents (USD)", "type": "stat", "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0}, "targets": [{"expr": "sum(focus_ledger_data_quality_cost_usd)", "refId": "A"}]},
        {"id": 4, "title": "Drift Gate Out-of-Band Drift & Policy Violations", "type": "stat", "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0}, "targets": [{"expr": "drift_gate_drift_detected_total", "refId": "A"}, {"expr": "sum(drift_gate_policy_violations_total)", "refId": "B"}]}
      ]
    }
