[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-ledger"
version = "0.2.0"
description = "Unified FinOps & AI Cost Attribution Engine normalizing cloud, Kubernetes, warehouse, and AI gateway telemetry into FinOps FOCUS 1.5."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Focus Ledger Contributors" }]
dependencies = [
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "prometheus-client>=0.20.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[project.scripts]
focus-ledger = "focus_ledger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
